controller_manager:
  ros__parameters:
    update_rate: 250
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.02
      panda_joint1: {trajectory: 0.20, goal: 0.01}
      panda_joint2: {trajectory: 0.20, goal: 0.01}
      panda_joint3: {trajectory: 0.20, goal: 0.01}
      panda_joint4: {trajectory: 0.20, goal: 0.01}
      panda_joint5: {trajectory: 0.20, goal: 0.01}
      panda_joint6: {trajectory: 0.20, goal: 0.01}
      panda_joint7: {trajectory: 0.20, goal: 0.01}

panda_hand_controller:
  ros__parameters:
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    action_monitor_rate: 20.0
    gains:
      panda_finger_joint1:
        p: 1200.0
        i: 0.0
        d: 4.0
        u_clamp_min: -20.0
        u_clamp_max: 20.0
      panda_finger_joint2:
        p: 1200.0
        i: 0.0
        d: 4.0
        u_clamp_min: -20.0
        u_clamp_max: 20.0
    constraints:
      # A grasp target is intentionally unreachable once the pads contact an object.
      # Accept the contact-limited finger position while the effort PID retains
      # a bounded normal force on the object.
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
      panda_finger_joint1:
        trajectory: 0.04
        goal: 0.004
      panda_finger_joint2:
        trajectory: 0.04
        goal: 0.004
